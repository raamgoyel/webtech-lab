<h1>Task 1: Patient Registration Fee Calculation</h1>
<p>Urine Test Strip Reader System - CityCare Hospital</p>

<label>Patient Name:</label><br>
<input type="text" id="patientName"><br><br>

<label>Patient ID:</label><br>
<input type="text" id="patientId"><br><br>

<label>Patient Age:</label><br>
<input type="number" id="patientAge"><br><br>

<label>Consultation Fee:</label><br>
<input type="number" id="consultationFee"><br><br>

<label>Registration Fee:</label><br>
<input type="number" id="registrationFee"><br><br>

<button onclick="calculateFee()">Calculate Total</button>

<div id="result"></div>

<script>
function calculateFee() {
    var patientName = document.getElementById("patientName").value;
    var patientId = document.getElementById("patientId").value;
    var age = Number(document.getElementById("patientAge").value);
    var consultationFee = Number(document.getElementById("consultationFee").value);
    var registrationFee = Number(document.getElementById("registrationFee").value);

    var totalAmount = consultationFee + registrationFee;
    var status = "Full Payment";

    if (age >= 60) {
        totalAmount = totalAmount * 0.9;
        status = "Senior Citizen Discount Applied (10%)";
    }

    var message = "Patient: " + patientName +
        "\nPatient ID: " + patientId +
        "\nTotal Amount: Rs. " + totalAmount +
        "\nStatus: " + status;

    alert(message);
    console.log(message);

    document.getElementById("result").innerHTML =
        "<p>Patient Name: " + patientName + "</p>" +
        "<p>Patient ID: " + patientId + "</p>" +
        "<p>Total Amount: Rs. " + totalAmount + "</p>" +
        "<p>Registration Status: " + status + "</p>";

    document.write("<h2>Fee Calculation Result</h2>");
    document.write("<p>Patient Name: " + patientName + "</p>");
    document.write("<p>Patient ID: " + patientId + "</p>");
    document.write("<p>Total Amount: Rs. " + totalAmount + "</p>");
    document.write("<p>Status: " + status + "</p>");
    document.write("<p><a href='js-task1-fee.html'>Go Back</a></p>");
}
</script>

</body>
