<h1>Patient Registration Form</h1>

<form>
<label>Patient Name:</label><br>
<input type="text" name="patient_name"><br><br>

<label>Age:</label><br>
<input type="number" name="age"><br><br>

<label>Gender:</label><br>
<select name="gender">
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select><br><br>

<label>Mobile Number:</label><br>
<input type="tel" name="mobile"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Patient ID:</label><br>
<input type="text" name="patient_id"><br><br>

<label>Test Date:</label><br>
<input type="date" name="test_date"><br><br>

<label>Doctor Name:</label><br>
<input type="text" name="doctor_name"><br><br>

<label>Symptoms:</label><br>
<input type="checkbox" name="symptoms" value="burning"> Burning while urinating<br>
<input type="checkbox" name="symptoms" value="fever"> Fever<br>
<input type="checkbox" name="symptoms" value="frequent"> Frequent urination<br>
<input type="checkbox" name="symptoms" value="pain"> Lower abdominal pain<br><br>

<label>Preferred Report Format:</label><br>
<input type="radio" name="report_format" value="pdf"> PDF<br>
<input type="radio" name="report_format" value="print"> Printed Copy<br>
<input type="radio" name="report_format" value="email"> Email<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
